name: Build Qoriqlash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Gradle
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
            export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Create project files
        run: |
          set -e
          mkdir -p .github/workflows app/src/main/assets app/src/main/java/uz/qoriqlash/app app/src/main/res/values

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Qoriqlash"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.qoriqlash.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "uz.qoriqlash.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          -keep class uz.qoriqlash.app.MainActivity$CameraBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class uz.qoriqlash.app.MonitorForegroundService { *; }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Qo‘riqlash</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="Qo‘riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <service
                      android:name=".MonitorForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/CameraAuthClient.kt
          package uz.qoriqlash.app

          import okhttp3.Credentials
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.security.MessageDigest
          import java.util.concurrent.TimeUnit

          object CameraAuthClient {
              private fun md5(input: String): String {
                  val bytes = MessageDigest.getInstance("MD5").digest(input.toByteArray(Charsets.UTF_8))
                  return bytes.joinToString("") { "%02x".format(it) }
              }

              private fun parseDigestParams(header: String): Map<String, String> {
                  val map = mutableMapOf<String, String>()
                  val raw = header.removePrefix("Digest ").trim()
                  val regex = Regex("""([a-zA-Z0-9_-]+)\s*=\s*(?:"([^"]*)"|([^,\s]+))""")
                  for (m in regex.findAll(raw)) {
                      val k = m.groupValues[1]
                      val v = if (m.groupValues[2].isNotEmpty()) m.groupValues[2] else m.groupValues[3]
                      map[k] = v
                  }
                  return map
              }

              private fun buildDigestHeader(
                  method: String,
                  uri: String,
                  user: String,
                  pass: String,
                  challenge: String
              ): String? {
                  val p = parseDigestParams(challenge)
                  val realm = p["realm"] ?: return null
                  val nonce = p["nonce"] ?: return null
                  val qop = p["qop"]?.split(",")?.map { it.trim() }?.firstOrNull { it == "auth" || it == "auth-int" }
                  val opaque = p["opaque"]

                  val ha1 = md5("$user:$realm:$pass")
                  val ha2 = md5("$method:$uri")

                  return if (qop != null) {
                      val nc = "00000001"
                      val cnonce = md5(System.nanoTime().toString()).take(16)
                      val resp = md5("$ha1:$nonce:$nc:$cnonce:$qop:$ha2")
                      buildString {
                          append("Digest username=\"$user\", realm=\"$realm\", nonce=\"$nonce\", uri=\"$uri\", ")
                          append("response=\"$resp\", qop=$qop, nc=$nc, cnonce=\"$cnonce\"")
                          if (!opaque.isNullOrEmpty()) append(", opaque=\"$opaque\"")
                      }
                  } else {
                      val resp = md5("$ha1:$nonce:$ha2")
                      buildString {
                          append("Digest username=\"$user\", realm=\"$realm\", nonce=\"$nonce\", uri=\"$uri\", ")
                          append("response=\"$resp\"")
                          if (!opaque.isNullOrEmpty()) append(", opaque=\"$opaque\"")
                      }
                  }
              }

              fun fetchSnapshotBytes(urlStr: String, user: String, pass: String): ByteArray? {
                  val client = OkHttpClient.Builder()
                      .connectTimeout(5, TimeUnit.SECONDS)
                      .readTimeout(8, TimeUnit.SECONDS)
                      .build()

                  val req1 = Request.Builder()
                      .url(urlStr)
                      .header("Cache-Control", "no-cache")
                      .build()

                  client.newCall(req1).execute().use { r1 ->
                      if (r1.isSuccessful) {
                          return r1.body?.bytes()
                      }
                      if (r1.code == 401 && (user.isNotEmpty() || pass.isNotEmpty())) {
                          val wwwAuth = r1.header("WWW-Authenticate") ?: ""
                          if (wwwAuth.contains("Digest", ignoreCase = true)) {
                              val parsedUrl = r1.request.url
                              val uriWithQuery = if (!parsedUrl.encodedQuery.isNullOrEmpty()) {
                                  "${parsedUrl.encodedPath}?${parsedUrl.encodedQuery}"
                              } else {
                                  parsedUrl.encodedPath
                              }
                              val digestHeader = buildDigestHeader("GET", uriWithQuery, user, pass, wwwAuth)
                              if (digestHeader != null) {
                                  val reqDigest = Request.Builder()
                                      .url(urlStr)
                                      .header("Cache-Control", "no-cache")
                                      .header("Authorization", digestHeader)
                                      .build()
                                  client.newCall(reqDigest).execute().use { rDigest ->
                                      if (rDigest.isSuccessful) return rDigest.body?.bytes()
                                  }
                              }
                          }

                          val reqBasic = Request.Builder()
                              .url(urlStr)
                              .header("Cache-Control", "no-cache")
                              .header("Authorization", Credentials.basic(user, pass))
                              .build()
                          client.newCall(reqBasic).execute().use { rBasic ->
                              if (rBasic.isSuccessful) return rBasic.body?.bytes()
                          }
                      }
                  }
                  return null
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/MonitorForegroundService.kt
          package uz.qoriqlash.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.BitmapFactory
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import androidx.core.app.NotificationCompat
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.MultipartBody
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import java.util.concurrent.TimeUnit
          import kotlin.math.abs

          class MonitorForegroundService : Service() {

              companion object {
                  const val CHANNEL_ID = "qoriqlash_fg_channel"
                  const val NOTIF_ID = 7071
                  const val ACTION_START = "uz.qoriqlash.app.START_BG"
                  const val ACTION_STOP = "uz.qoriqlash.app.STOP_BG"
              }

              private val handler = Handler(Looper.getMainLooper())
              private var active = false
              private var tok = ""
              private var cid = ""
              private var usr = ""
              private var pwd = ""
              private var sens = 5
              private var urls: List<String> = emptyList()
              private val lastGray = mutableMapOf<String, ByteArray>()
              private var lastAlertMs = 0L
              private var idx = 0

              private val pollRunnable = object : Runnable {
                  override fun run() {
                      if (!active) return
                      Thread {
                          try {
                              pollOnce()
                          } catch (_: Exception) {
                          }
                      }.start()
                      handler.postDelayed(this, 1500L)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopBg()
                          return START_NOT_STICKY
                      }
                      else -> {
                          tok = intent?.getStringExtra("tok")?.trim() ?: ""
                          cid = intent?.getStringExtra("cid")?.trim() ?: ""
                          usr = intent?.getStringExtra("usr")?.trim() ?: ""
                          pwd = intent?.getStringExtra("pwd")?.trim() ?: ""
                          sens = (intent?.getIntExtra("sens", 5) ?: 5).coerceIn(1, 10)
                          urls = intent?.getStringArrayListExtra("urls")?.filter { it.isNotBlank() } ?: emptyList()

                          startForeground(NOTIF_ID, buildNotif("IP / NVR fon nazorati faol (${urls.size} kanal)"))
                          active = true
                          handler.removeCallbacks(pollRunnable)
                          handler.post(pollRunnable)
                      }
                  }
                  return START_STICKY
              }

              private fun stopBg() {
                  active = false
                  handler.removeCallbacks(pollRunnable)
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  active = false
                  handler.removeCallbacks(pollRunnable)
                  super.onDestroy()
              }

              private fun pollOnce() {
                  if (urls.isEmpty()) return
                  val url = urls[idx % urls.size]
                  idx++

                  val bytes = CameraAuthClient.fetchSnapshotBytes(url, usr, pwd) ?: return
                  if (bytes.isEmpty()) return

                  val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts) ?: return
                  val w = bmp.width.coerceAtLeast(1)
                  val h = bmp.height.coerceAtLeast(1)
                  val pixels = IntArray(w * h)
                  bmp.getPixels(pixels, 0, w, 0, 0, w, h)
                  bmp.recycle()

                  val gray = ByteArray(w * h)
                  for (i in pixels.indices) {
                      val p = pixels[i]
                      val r = (p ushr 16) and 0xFF
                      val g = (p ushr 8) and 0xFF
                      val b = p and 0xFF
                      gray[i] = ((r * 30 + g * 59 + b * 11) / 100).toByte()
                  }

                  val prev = lastGray[url]
                  lastGray[url] = gray
                  if (prev != null && prev.size == gray.size) {
                      var diff = 0
                      var sampled = 0
                      var i = 0
                      while (i < gray.size) {
                          sampled++
                          if (abs((gray[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 26) {
                              diff++
                          }
                          i += 4
                      }
                      val ratio = if (sampled > 0) (diff * 100.0) / sampled else 0.0
                      val threshold = (11 - sens) * 1.4
                      val now = System.currentTimeMillis()
                      if (ratio > threshold && now - lastAlertMs > 12000L) {
                          lastAlertMs = now
                          sendTelegramPhoto(bytes, "🚨 Fon nazorati: harakat aniqlandi ($url)")
                      }
                  }
              }

              private fun sendTelegramPhoto(jpegBytes: ByteArray, caption: String) {
                  if (tok.isEmpty() || cid.isEmpty()) return
                  try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart(
                              "photo",
                              "snap.jpg",
                              jpegBytes.toRequestBody("image/jpeg".toMediaType())
                          )
                          .build()
                      val req = Request.Builder()
                          .url("https://api.telegram.org/bot$tok/sendPhoto")
                          .post(body)
                          .build()
                      OkHttpClient.Builder().connectTimeout(6, TimeUnit.SECONDS).readTimeout(10, TimeUnit.SECONDS).build()
                          .newCall(req).execute().close()
                  } catch (_: Exception) {
                  }
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pi = PendingIntent.getActivity(
                      this, 0, openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Qo‘riqlash · CYBER-BOT")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(
                          CHANNEL_ID,
                          "Qo‘riqlash fon nazorati",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(ch)
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/MainActivity.kt
          package uz.qoriqlash.app

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.PermissionRequest
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat

          class MainActivity : ComponentActivity() {

              private lateinit var webView: WebView
              private var pendingPermissionRequest: PermissionRequest? = null

              private val requestPermissionsLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                      pendingPermissionRequest?.let { req ->
                          req.grant(req.resources)
                          pendingPermissionRequest = null
                      }
                  }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this).apply {
                      settings.javaScriptEnabled = true
                      settings.domStorageEnabled = true
                      settings.mediaPlaybackRequiresUserGesture = false
                      settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW

                      webViewClient = WebViewClient()
                      webChromeClient = object : WebChromeClient() {
                          override fun onPermissionRequest(request: PermissionRequest) {
                              val needed = arrayOf(
                                  Manifest.permission.CAMERA,
                                  Manifest.permission.RECORD_AUDIO
                              ).filter {
                                  ContextCompat.checkSelfPermission(this@MainActivity, it) != PackageManager.PERMISSION_GRANTED
                              }
                              if (needed.isEmpty()) {
                                  request.grant(request.resources)
                              } else {
                                  pendingPermissionRequest = request
                                  requestPermissionsLauncher.launch(needed.toTypedArray())
                              }
                          }
                      }

                      addJavascriptInterface(CameraBridge(this@MainActivity, this), "Android")
                      loadUrl("file:///android_asset/index.html")
                  }

                  setContentView(webView)
                  ensurePermissions()
              }

              private fun ensurePermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  }
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isNotEmpty()) {
                      requestPermissionsLauncher.launch(missing.toTypedArray())
                  }
              }

              override fun onDestroy() {
                  webView.destroy()
                  super.onDestroy()
              }

              private class CameraBridge(
                  private val activity: ComponentActivity,
                  private val webView: WebView
              ) {
                  @JavascriptInterface
                  fun setBgMonitor(enable: Boolean, tok: String, cid: String, usr: String, pwd: String, sens: Int, urlsCsv: String) {
                      activity.runOnUiThread {
                          if (!enable) {
                              val stopIntent = Intent(activity, MonitorForegroundService::class.java).apply {
                                  action = MonitorForegroundService.ACTION_STOP
                              }
                              activity.startService(stopIntent)
                              return@runOnUiThread
                          }
                          val list = ArrayList(urlsCsv.split("||").map { it.trim() }.filter { it.isNotEmpty() })
                          val startIntent = Intent(activity, MonitorForegroundService::class.java).apply {
                              action = MonitorForegroundService.ACTION_START
                              putExtra("tok", tok)
                              putExtra("cid", cid)
                              putExtra("usr", usr)
                              putExtra("pwd", pwd)
                              putExtra("sens", sens)
                              putStringArrayListExtra("urls", list)
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              activity.startForegroundService(startIntent)
                          } else {
                              activity.startService(startIntent)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun snap(id: Int, url: String, user: String, pass: String) {
                      Thread {
                          var b64Result = ""
                          try {
                              val bytes = CameraAuthClient.fetchSnapshotBytes(url, user, pass)
                              if (bytes != null && bytes.isNotEmpty()) {
                                  b64Result = Base64.encodeToString(bytes, Base64.NO_WRAP)
                              }
                          } catch (_: Exception) {
                              b64Result = ""
                          }

                          val escaped = b64Result.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onSnap($id, '$escaped');", null)
                          }
                      }.start()
                  }
              }
          }
          EOF

          cat <<'EOF' > app/src/main/assets/index.html
