          <script>
          const H="0483921c9d5a28b0671d581a463abd3d8f0c507cd88d66d66350677a3d430a66";
          const $=i=>document.getElementById(i);
          const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          let S=ld('qoriqlash_s',ld('isab_s',{src:'phone',facing:'environment',dur:0,imgRes:'max',imgQual:0.95,tok:'',cid:'',fv:true,fa:true,fp:false,fk:false,fw:true,fbg:true,sens:5}));
          const F={br:'br',ipa:'ipa',prt:'prt',usr:'usr',pwd:'pwd',chs:'chs',ip:'ipu'};
          let PV={},ci=-1,curKey='',curLabel='',lastBlob=null,lastEventTs=0,lastAttTs=0;
          let LOG=ld('qoriqlash_log',ld('isab_log',[])),run=false,stream=null,lastSoundTs=0,rec=null,wl=null,actx,an,timer,ipBusy=false;
          let ipRecTimer=null,ipRecActive=false,autoStopTimer=null;
          let burstTimer=null,burstStopTimer=null,burstActive=false,burstCount=0;

          function sha256(s){
           const r=(n,x)=>(x>>>n)|(x<<(32-n));
           const K=[],h=[];let p=0,c={};
           for(let n=2;p<64;n++){if(!c[n]){for(let i=0;i<313;i+=n)c[i]=n;h[p]=(Math.pow(n,.5)*4294967296)|0;K[p++]=(Math.pow(n,1/3)*4294967296)|0}}
           h.length=8;
           const b=unescape(encodeURIComponent(s));const l=b.length*8;const w=[];
           for(let i=0;i<b.length;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
           w[b.length>>2]|=0x80<<(24-(b.length%4)*8);
           const len=((b.length+8>>6)+1)*16;w[len-1]=l;
           for(let j=0;j<len;j+=16){const a=w.slice(j,j+16),o=h.slice(0);
            for(let i=0;i<64;i++){
             if(i>=16){const a15=a[i-15]|0,a2=a[i-2]|0;
              a[i]=(a[i-16]|0)+(r(7,a15)^r(18,a15)^(a15>>>3))+(a[i-7]|0)+(r(17,a2)^r(19,a2)^(a2>>>10))|0}
             const e=o[4],A=o[0];
             const t1=(o[7]+(r(6,e)^r(11,e)^r(25,e))+((e&o[5])^(~e&o[6]))+K[i]+(a[i]|0))|0;
             const t2=((r(2,A)^r(13,A)^r(22,A))+((A&o[1])^(A&o[2])^(o[1]&o[2])))|0;
             o.unshift((t1+t2)|0);o[4]=(o[4]+t1)|0;o.pop()}
            for(let i=0;i<8;i++)h[i]=(h[i]+o[i])|0}
           return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}
          async function sha(s){return sha256(s)}

          async function login(){
           const h=await sha($('u').value.trim()+':'+$('p').value.trim());
           if(h===H){sv('qoriqlash_auth',1);enter()}else $('ge').textContent='Kod yoki parol noto‘g‘ri';}
          function enter(){$('gate').classList.add('hide');$('app').classList.remove('hide');init();}
          function logout(){localStorage.removeItem('qoriqlash_auth');localStorage.removeItem('isab_auth');location.reload()}
          if(ld('qoriqlash_auth',0)===1||ld('isab_auth',0)===1)enter();

          function updateCamBadge(){
           if(S.src==='ip'){$('camBadge').textContent='IP / NVR REJIM';return;}
           $('camBadge').textContent=S.facing==='user'?'OLDI KAMERA':'ORQA KAMERA';
          }

          function syncDurationUI(){
           const sec=Math.max(0,+(S.dur||0));
           const presetVals=['0','15','30','60','180','300'];
           $('dur').value=presetVals.includes(String(sec))?String(sec):'0';
           $('customSec').value=sec>0?String(sec):'';
          }

          function onDurPreset(){
           S.dur=Math.max(0,+($('dur').value||0));
           $('customSec').value=S.dur>0?String(S.dur):'';
           save();
          }

          function onCustomSec(){
           const raw=parseInt($('customSec').value,10);
           S.dur=(!isNaN(raw)&&raw>0)?Math.min(86400,raw):0;
           syncDurationUI();
           save();
          }

          function parseChannels(raw){
           const parts=(raw||'1').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
           const set=new Set();
           for(const p of parts){
            const range=p.match(/^(\d+)-(\d+)$/);
            if(range){
             const a=Math.max(1,parseInt(range[1],10));
             const b=Math.min(64,parseInt(range[2],10));
             for(let n=a;n<=b;n++)set.add(String(n));
            }else if(/^\d+$/.test(p)){
             set.add(String(Math.max(1,parseInt(p,10))));
            }
           }
           return set.size?[...set]:['1'];
          }

          function camTargets(){
           if(S.br==='url'){
            return splitList(S.ip).map((u,idx)=>({key:'u'+idx,label:'URL #'+(idx+1),url:u}));
           }
           const ips=splitList(S.ipa);
           const channels=parseChannels(S.chs);
           const out=[];
           for(const ip of ips){
            const base=(/^https?:\/\//i.test(ip)?ip.replace(/\/+$/,''):'http://'+ip)+(S.prt&&S.prt!='80'&&!/:\d+$/.test(ip)?':'+S.prt:'');
            for(const ch of channels){
             const url=S.br==='dahua'
              ?base+'/cgi-bin/snapshot.cgi?channel='+ch
              :base+'/ISAPI/Streaming/channels/'+(+ch*100+1)+'/picture';
             out.push({key:ip+'_'+ch,label:ip+' (kan '+ch+')',url});
            }
           }
           return out;
          }

          function syncNativeBg(enable){
           if(!window.Android||typeof Android.setBgMonitor!=='function')return;
           const urlsCsv=camTargets().map(t=>t.url).join('||');
           Android.setBgMonitor(
            !!(enable&&S.fbg&&S.src==='ip'&&urlsCsv),
            S.tok||'',
            S.cid||'',
            S.usr||'',
            S.pwd||'',
            +(S.sens||5),
            urlsCsv
           );
          }

          function init(){
           S.facing=S.facing||'environment';
           S.dur=Math.max(0,+(S.dur||0));
           S.imgRes=S.imgRes||'max';
           S.imgQual=+(S.imgQual||0.95);
           if(S.fbg===undefined)S.fbg=true;
           for(const k of ['tok','cid','sens','src','facing','imgRes'])$(k).value=S[k];
           $('imgQual').value=String(S.imgQual);
           syncDurationUI();
           for(const [k,i] of Object.entries(F))$(i).value=S[k]||'';
           for(const k of ['fv','fa','fp','fk','fw','fbg'])$(k).checked=!!S[k];
           updateCamBadge();
           renderLog();
           if(ld('qoriqlash_run',false)&&!run)toggle();
          }
          function save(){
           Object.assign(S,{
            src:$('src').value,
            facing:$('facing').value,
            dur:Math.max(0,+(S.dur||0)),
            imgRes:$('imgRes').value,
            imgQual:+($('imgQual').value||0.95),
            tok:$('tok').value.trim(),
            cid:$('cid').value.trim(),
            sens:+$('sens').value
           });
           for(const [k,i] of Object.entries(F))S[k]=$(i).value.trim();
           for(const k of ['fv','fa','fp','fk','fw','fbg'])S[k]=$(k).checked;
           updateCamBadge();
           sv('qoriqlash_s',S);
           if(run)syncNativeBg(true);
          }
          function tab(n,b){for(const x of ['home','set','log'])$('t-'+x).classList.toggle('hide',x!==n);
           document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
          const msg=(id,t,c)=>{$(id).textContent=t;$(id).className='st '+(c||'')};

          const API=m=>`https://api.telegram.org/bot${S.tok}/${m}`;
          async function testTg(){save();msg('s2','Tekshirilmoqda...');
           try{const a=await(await fetch(API('getMe'))).json();if(!a.ok)throw 0;
            const b=await(await fetch(API('sendMessage'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.cid,text:'✅ Qo‘riqlash ulandi'})})).json();
            b.ok?msg('s2','✅ Ulandi: @'+a.result.username,'ok'):msg('s2','❌ Chat ID noto‘g‘ri (botga /start yozing)','er')}
           catch(e){msg('s2','❌ Token noto‘g‘ri yoki internet yo‘q','er')}}
          async function tgSend(kind,blob,cap){
           if(!S.tok||!S.cid||!blob)return;const f=new FormData();f.append('chat_id',S.cid);f.append('caption',cap);
           f.append(kind==='photo'?'photo':'video',blob,kind==='photo'?'a.jpg':'a.webm');
           try{await fetch(API(kind==='photo'?'sendPhoto':'sendVideo'),{method:'POST',body:f})}catch(e){}}
          const tgText=t=>S.tok&&S.cid&&fetch(API('sendMessage'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.cid,text:t})}).catch(()=>{});

          function videoConstraints(){
           const f=S.facing||'environment';
           if(S.imgRes==='1080')return {facingMode:f,width:{ideal:1920},height:{ideal:1080}};
           if(S.imgRes==='720')return {facingMode:f,width:{ideal:1280},height:{ideal:720}};
           if(S.imgRes==='480')return {facingMode:f,width:{ideal:640},height:{ideal:480}};
           return {facingMode:f,width:{ideal:3840},height:{ideal:2160}};
          }

          function targetDimensions(natW,natH){
           const w=natW||1280,h=natH||720;
           if(S.imgRes==='max')return {w,h};
           const maxSide=+(S.imgRes||1080);
           const scale=Math.min(1,maxSide/Math.max(w,h));
           return {w:Math.max(160,Math.round(w*scale)),h:Math.max(120,Math.round(h*scale))};
          }

          async function startPhone(){
           stream&&stream.getTracks().forEach(t=>t.stop());
           stream=await navigator.mediaDevices.getUserMedia({
            video:videoConstraints(),
            audio:S.fa||S.fv
           });
           const v=$('v');v.srcObject=stream;v.classList.remove('hide');$('ip').classList.add('hide');await v.play();
           if(S.fa){if(actx){actx.close().catch(()=>{})}actx=new(window.AudioContext||webkitAudioContext)();const s=actx.createMediaStreamSource(stream);an=actx.createAnalyser();an.fftSize=512;s.connect(an)}}

          async function flipFacing(){
           S.facing=S.facing==='environment'?'user':'environment';
           $('facing').value=S.facing;
           save();
           if(S.src==='phone'&&run){
            try{await startPhone();PV={};msg('hs','Kamera almashtirildi: '+(S.facing==='user'?'Oldi kamera':'Orqa kamera'),'ok')}
            catch(e){msg('hs','❌ Kamera almashtirilmadi: '+(e.message||e),'er')}
           }else{
            msg('s1','Kamera holati: '+(S.facing==='user'?'Oldi kamera':'Orqa kamera'),'ok');
           }
          }

          async function onFacingChange(){
           save();
           if(S.src==='phone'&&run){
            try{await startPhone();PV={};msg('hs','Kamera almashtirildi','ok')}catch(e){}
           }
          }

          async function testPhone(){msg('s1','Tekshirilmoqda...');
           try{const s=await navigator.mediaDevices.getUserMedia({video:videoConstraints()});const v=$('v');v.srcObject=s;v.classList.remove('hide');$('ip').classList.add('hide');await v.play();
            msg('s1','✅ '+(S.facing==='user'?'Oldi':'Orqa')+' kamera tayyor ('+(v.videoWidth||1280)+'x'+(v.videoHeight||720)+')','ok');setTimeout(()=>{if(!run){s.getTracks().forEach(t=>t.stop())}},4000)}
           catch(e){msg('s1','❌ Kamera ruxsati berilmadi','er')}}

          const NP={};let nid=0;
          window.onSnap=(id,b64)=>{const f=NP[id];if(f){delete NP[id];f(b64)}};
          const splitList=v=>(v||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);

          function ipFrameByUrl(u){return new Promise((res,rej)=>{
           if(!u)return rej(new Error('no_url'));
           if(window.Android){const id=++nid;
            NP[id]=b=>{if(!b)return rej(new Error('x'));const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);res(new Blob([a],{type:'image/jpeg'}))};
            setTimeout(()=>{if(NP[id]){delete NP[id];rej(new Error('t'))}},9500);
            Android.snap(id,u,S.usr||'',S.pwd||'')}
           else fetch(u,{cache:'no-store'}).then(r=>r.ok?r.blob():Promise.reject()).then(res,rej)})}

          async function testIp(){save();msg('s3','NVR / IP kanallar tekshirilmoqda...');const ok=[],bad=[];
           const list=camTargets();
           if(!list.length){msg('s3','❌ Kamida bitta IP manzil yoki URL kiriting','er');return;}
           for(const t of list){try{const b=await ipFrameByUrl(t.url);const u=URL.createObjectURL(b);$('pv').src=u;$('pv').classList.remove('hide');lastBlob=b;ok.push(`${t.label} (${Math.round(b.size/1024)}KB)`)}catch(e){bad.push(t.label)}}
           if(!ok.length)msg('s3','❌ Ulanib bo‘lmadi. IP, login, parol va kanallarni tekshiring','er');
           else msg('s3','✅ Ishlayapti: '+ok.join(', ')+(bad.length?' | ❌ ulanmadi: '+bad.join(', '):''),'ok')}

          function armAutoStop(){
           clearTimeout(autoStopTimer);
           const sec=+(S.dur||0);
           if(sec>0){
            autoStopTimer=setTimeout(()=>{
             stop();
             msg('hs','⏱ Belgilangan '+sec+' soniya tugadi — nazorat avtomatik to‘xtatildi','ok');
            },sec*1000);
           }
          }

          async function captureSinglePhoto(){
           const q=+(S.imgQual||0.95);
           if(S.src==='phone'&&$('v').videoWidth){
            const {w,h}=targetDimensions($('v').videoWidth,$('v').videoHeight);
            $('c').width=w;$('c').height=h;
            $('c').getContext('2d').drawImage($('v'),0,0,w,h);
            return await new Promise(resolve=>$('c').toBlob(b=>resolve(b),'image/jpeg',q));
           }else if(S.src==='ip'){
            const list=camTargets();
            if(!list.length)return null;
            ci=(ci+1)%list.length;
            const target=list[ci];
            curKey=target.key;curLabel=target.label;
            const raw=await ipFrameByUrl(target.url);
            lastBlob=raw;
            const u=URL.createObjectURL(raw);$('ip').src=u;setTimeout(()=>URL.revokeObjectURL(u),3000);
            if(S.imgRes==='max')return raw;
            const bm=await createImageBitmap(raw);
            const {w,h}=targetDimensions(bm.width,bm.height);
            $('c').width=w;$('c').height=h;
            $('c').getContext('2d').drawImage(bm,0,0,w,h);
            bm.close&&bm.close();
            return await new Promise(resolve=>$('c').toBlob(b=>resolve(b),'image/jpeg',q));
           }
           return null;
          }

          async function checkPhotoFormat(){
           save();
           msg('s1','Rasm formati tekshirilmoqda...');
           try{
            let tempStream=null;
            if(S.src==='phone'&&(!run||!$('v').videoWidth)){
             tempStream=await navigator.mediaDevices.getUserMedia({video:videoConstraints()});
             const v=$('v');v.srcObject=tempStream;v.classList.remove('hide');$('ip').classList.add('hide');await v.play();
            }
            const blob=await captureSinglePhoto();
            if(tempStream&&!run){setTimeout(()=>tempStream.getTracks().forEach(t=>t.stop()),1500)}
            if(!blob){msg('s1','❌ Kadr olinmadi','er');return;}
            const bm=await createImageBitmap(blob);
            const kb=Math.round(blob.size/1024);
            msg('s1',`✅ Format: ${blob.type||'image/jpeg'} | O‘lcham: ${bm.width}x${bm.height} | Hajm: ${kb} KB`,'ok');
            bm.close&&bm.close();
           }catch(e){
            msg('s1','❌ Format tekshiruvida xato: '+(e.message||e),'er');
           }
          }

          async function burstTick(){
           if(!burstActive)return;
           burstCount++;
           const idx=burstCount;
           const camInfo=S.src==='ip'?(curLabel?' ['+curLabel+']':''):' ['+(S.facing==='user'?'Oldi kamera':'Orqa kamera')+']';
           try{
            const blob=await captureSinglePhoto();
            if(blob){
             const kb=Math.round(blob.size/1024);
             const cap=`⚡ 1s rasm #${idx}${camInfo} (${kb}KB) — ${new Date().toLocaleString('uz')}`;
             tgSend('photo',blob,cap);
             add('photo',`1s rasm #${idx}${camInfo} [${kb}KB]`);
             msg('hs',`⚡ 1s/1 rasm faol: ${idx} ta rasm (${kb} KB)`,'ok');
            }
           }catch(e){}
          }

          function stopBurstOnly(){
           burstActive=false;
           clearInterval(burstTimer);burstTimer=null;
           clearTimeout(burstStopTimer);burstStopTimer=null;
           $('burstBtn').textContent='⚡ 1s/1 rasm (ixtiyoriy vaqt)';
           $('burstBtn').classList.remove('r');
          }

          async function toggle1sBurst(){
           if(burstActive){
            stopBurstOnly();
            msg('hs','⚡ 1s/1 rasm to‘xtatildi (jami '+burstCount+' ta rasm)','ok');
            return;
           }
           save();
           if(S.src==='phone'&&!run){
            try{
             await startPhone();
             run=true;PV={};
             $('go').textContent='⏹ To‘xtatish';$('go').classList.add('r');
             $('state').textContent='● Faol';$('state').className='st ok';
            }catch(e){
             msg('hs','❌ Kamera ochilmadi: '+(e.message||e),'er');
             return;
            }
           }else if(S.src==='ip'&&!run){
            $('v').classList.add('hide');$('ip').classList.remove('hide');
           }
           const sec=Math.max(0,+(S.dur||0));
           burstActive=true;
           burstCount=0;
           $('burstBtn').textContent='⏹ 1s/1 rasmni to‘xtatish';
           $('burstBtn').classList.add('r');
           msg('hs',sec>0?('⚡ 1s/1 rasm boshlandi ('+sec+' soniya davomida)'):'⚡ 1s/1 rasm boshlandi (cheksiz — o‘zingiz to‘xtatasiz)','ok');
           burstTick();
           burstTimer=setInterval(burstTick,1000);
           if(sec>0){
            burstStopTimer=setTimeout(()=>{
             stopBurstOnly();
             msg('hs','⏱ '+sec+' soniya tugadi — 1s/1 rasm yakunlandi ('+burstCount+' ta rasm)','ok');
            },sec*1000);
           }
          }

          async function toggle(){
           if(run){stop();return}
           save();try{
            if(S.src==='phone')await startPhone();else{$('v').classList.add('hide');$('ip').classList.remove('hide')}
            run=true;sv('qoriqlash_run',true);PV={};ci=-1;$('go').textContent='⏹ To‘xtatish';$('go').classList.add('r');
            $('state').textContent='● Faol';$('state').className='st ok';
            msg('hs',S.dur>0?('⏱ '+S.dur+' soniyalik nazorat boshlandi'):'','ok');
            if(S.fw&&navigator.wakeLock)try{wl=await navigator.wakeLock.request('screen')}catch(e){}
            syncNativeBg(true);
            armAutoStop();
            clearInterval(timer);timer=setInterval(tick,700);
           }catch(e){msg('hs','❌ Boshlab bo‘lmadi: '+(e.message||e),'er')}}
          function stop(){run=false;sv('qoriqlash_run',false);clearInterval(timer);clearInterval(ipRecTimer);clearTimeout(autoStopTimer);ipRecActive=false;
           stopBurstOnly();
           syncNativeBg(false);
           if(rec&&rec.state==='recording'){try{rec.stop()}catch(e){}}
           stream&&stream.getTracks().forEach(t=>t.stop());stream=null;
           if(actx){actx.close().catch(()=>{});actx=null;an=null}
           wl&&wl.release().catch(()=>{});wl=null;
           $('go').textContent='▶ Nazoratni boshlash';$('go').classList.remove('r');$('state').textContent='○ O‘chiq';$('state').className='st'}
          document.addEventListener('visibilitychange',async()=>{if(run&&!document.hidden&&S.fw&&navigator.wakeLock)try{wl=await navigator.wakeLock.request('screen')}catch(e){}});

          async function drawIpToVideoCanvas(blob){
           const vc=$('vc');
           const vctx=vc.getContext('2d');
           const bm=await createImageBitmap(blob);
           if(vc.width!==bm.width||vc.height!==bm.height){
            vc.width=Math.min(1280,bm.width||640);
            vc.height=Math.min(720,bm.height||480);
           }
           vctx.drawImage(bm,0,0,vc.width,vc.height);
           bm.close&&bm.close();
          }

          async function frame(){
           const c=$('c'),x=c.getContext('2d',{willReadFrequently:true});c.width=160;c.height=120;
           if(S.src==='phone'){curKey='ph_'+(S.facing||'environment');curLabel='';if(!$('v').videoWidth)return null;x.drawImage($('v'),0,0,160,120)}
           else{if(ipBusy)return null;ipBusy=true;try{
            const list=camTargets();if(!list.length){ipBusy=false;return null;}
            ci=(ci+1)%list.length;const target=list[ci];
            curKey=target.key;curLabel=target.label;
            const b=await ipFrameByUrl(target.url);lastBlob=b;
            if(ipRecActive)await drawIpToVideoCanvas(b);
            const bm=await createImageBitmap(b);x.drawImage(bm,0,0,160,120);bm.close&&bm.close();
            const u=URL.createObjectURL(b);$('ip').src=u;setTimeout(()=>URL.revokeObjectURL(u),3000)
           }catch(e){ipBusy=false;return null}ipBusy=false}
           return x.getImageData(0,0,160,120).data}

          function estimatePeople(d,prev){
           let activeCols=new Set();
           for(let y=0;y<120;y+=4){
            for(let x=0;x<160;x+=4){
             const idx=(y*160+x)*4;
             if(Math.abs(d[idx]-prev[idx])+Math.abs(d[idx+1]-prev[idx+1])>65){
              activeCols.add(Math.floor(x/20));
             }
            }
           }
           if(activeCols.size===0)return 0;
           return Math.max(1,Math.min(10,Math.ceil(activeCols.size/2)));
          }

          async function tick(){
           const d=await frame();if(!d)return;
           const prev=PV[curKey];
           if(prev){
            let n=0;for(let i=0;i<d.length;i+=16)if(Math.abs(d[i]-prev[i])+Math.abs(d[i+1]-prev[i+1])>60)n++;
            const th=(11-S.sens)*18;
            const hasMotion=n>th;
            $('dot').textContent=hasMotion?'● HARAKAT'+(curLabel?' · '+curLabel:''):'● Kuzatilmoqda'+(curLabel?' · '+curLabel:'');
            if(hasMotion){
             const camTag=curLabel?' ['+curLabel+']':' ['+(S.facing==='user'?'Oldi kamera':'Orqa kamera')+']';
             let extra='';
             if(S.fp){const est=estimatePeople(d,prev);if(est>0)extra=` — taxminan ${est} ta harakat/odam`;}
             event('motion','Harakat aniqlandi'+camTag+extra);
             if(S.fk){
              const now=Date.now();
              if(now-lastAttTs>60000){
               lastAttTs=now;
               const mode=new Date().getHours()<13?'Keldi (kirish)':'Ketdi/harakat (chiqish)';
               add('att','Davomat: '+mode+camTag);
               tgText('🕘 Davomat qayd etildi: '+mode+camTag+' — '+new Date().toLocaleString('uz'));
              }
             }
            }
           }
           PV[curKey]=d;
           if(S.fa&&an){const a=new Uint8Array(an.fftSize);an.getByteTimeDomainData(a);let m=0;a.forEach(v=>m=Math.max(m,Math.abs(v-128)));
            if(m>(11-S.sens)*9+30&&Date.now()-lastSoundTs>15000){lastSoundTs=Date.now();event('sound','Baland tovush aniqlandi')}}}

          function start15sVideo(cap){
           if(!S.fv||!window.MediaRecorder||rec)return;
           const mimeTypes=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
           const mimeType=mimeTypes.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';

           if(S.src==='phone'&&stream){
            const ch=[];
            const opts=mimeType?{mimeType,videoBitsPerSecond:6000000}:{videoBitsPerSecond:6000000};
            try{rec=new MediaRecorder(stream,opts)}catch(e){rec=new MediaRecorder(stream)}
            rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
            rec.onstop=()=>{tgSend('video',new Blob(ch,{type:rec.mimeType||'video/webm'}),cap);rec=null};
            rec.start(500);
            setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},15000);
           }else if(S.src==='ip'&&lastBlob){
            const vc=$('vc');
            drawIpToVideoCanvas(lastBlob).then(()=>{
             const capStream=vc.captureStream(8);
             const ch=[];
             const opts=mimeType?{mimeType,videoBitsPerSecond:4000000}:{videoBitsPerSecond:4000000};
             try{rec=new MediaRecorder(capStream,opts)}catch(e){rec=new MediaRecorder(capStream)}
             ipRecActive=true;
             rec.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
             rec.onstop=()=>{
              ipRecActive=false;
              clearInterval(ipRecTimer);
              tgSend('video',new Blob(ch,{type:rec.mimeType||'video/webm'}),cap);
              rec=null;
             };
             rec.start(500);
             setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},15000);
            }).catch(()=>{});
           }
          }

          async function event(type,text){
           const now=Date.now();if(now-lastEventTs<16000)return;lastEventTs=now;
           add(type,text);const cap='🚨 '+text+' — '+new Date().toLocaleString('uz');
           const q=+(S.imgQual||0.95);
           if(S.src==='phone'&&$('v').videoWidth){
            const {w,h}=targetDimensions($('v').videoWidth,$('v').videoHeight);
            $('c').width=w;$('c').height=h;
            $('c').getContext('2d').drawImage($('v'),0,0,w,h);
            $('c').toBlob(b=>tgSend('photo',b,cap),'image/jpeg',q);
            start15sVideo(cap);
           }else if(lastBlob){
            tgSend('photo',lastBlob,cap);
            start15sVideo(cap);
           }
          }

          async function shot(){
           const cap='📸 Qo‘lda rasm — '+new Date().toLocaleString('uz');
           const q=+(S.imgQual||0.95);
           if(S.src==='phone'&&run&&$('v').videoWidth){
            const {w,h}=targetDimensions($('v').videoWidth,$('v').videoHeight);
            $('c').width=w;$('c').height=h;
            $('c').getContext('2d').drawImage($('v'),0,0,w,h);
            $('c').toBlob(b=>{add('photo','Qo‘lda rasm olindi ('+w+'x'+h+')');tgSend('photo',b,cap);msg('hs','Yuborildi ('+w+'x'+h+')','ok')},'image/jpeg',q);
           }else if(S.src==='ip'){
            try{
             const first=camTargets()[0];
             const b=lastBlob||(first&&await ipFrameByUrl(first.url));
             if(!b)throw new Error('no_frame');
             lastBlob=b;add('photo','IP kamera rasmi olindi'+(curLabel?' ['+curLabel+']':''));
             tgSend('photo',b,cap);msg('hs','IP rasm yuborildi','ok');
            }catch(e){msg('hs','❌ IP kameradan rasm olinmadi','er')}
           }else msg('hs','Avval nazoratni boshlang','er')}

          function iconFor(t){
           if(t==='sound')return '🔊';
           if(t==='photo')return '📸';
           if(t==='att')return '🕘';
           return '🎬';
          }
          function add(t,x){LOG.unshift({t,x,d:new Date().toLocaleString('uz'),ts:Date.now()});LOG=LOG.slice(0,300);sv('qoriqlash_log',LOG);renderLog()}
          function renderLog(){const q=$('q')?$('q').value.toLowerCase():'';
           $('log').innerHTML=LOG.filter(e=>(e.x+e.d).toLowerCase().includes(q)).map(e=>`<div class="ev">${iconFor(e.t)} ${e.x}<small>${e.d}</small></div>`).join('')||'<div class="st">Hodisa yo‘q</div>';
           const td=LOG.filter(e=>Date.now()-e.ts<864e5).length;$('cnt').textContent='So‘nggi 24 soatda: '+td+' ta hodisa'}
          function clr(){LOG=[];sv('qoriqlash_log',LOG);renderLog()}
          </script></body></html>
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoriqlash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
